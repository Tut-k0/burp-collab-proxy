---
- name: Install Nginx
  apt:
    name: nginx
    state: present
  tags: nginx

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx
  tags: nginx

- name: Create static site directory
  file:
    path: "{{ static_site_dir }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    mode: '0755'
  tags: nginx

- name: Copy static site files
  copy:
    src: "{{ static_site_source }}/"
    dest: "{{ static_site_dir }}/"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    mode: '0644'
  notify: restart nginx
  tags: nginx

- name: Ensure index.html has correct permissions
  file:
    path: "{{ static_site_dir }}/index.html"
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    mode: '0644'
  tags: nginx

- name: Configure Nginx main config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
    validate: nginx -t -c %s
  notify: restart nginx
  tags:
    - nginx
    - config

- name: Configure Burp Collaborator proxy site
  template:
    src: burp-site.conf.j2
    dest: /etc/nginx/sites-available/burp-collaborator
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx
  tags:
    - nginx
    - config

- name: Enable Burp Collaborator site
  file:
    src: /etc/nginx/sites-available/burp-collaborator
    dest: /etc/nginx/sites-enabled/burp-collaborator
    state: link
  notify: restart nginx
  tags: nginx

- name: Ensure Nginx is enabled and started
  systemd:
    name: nginx
    enabled: yes
    state: started
  tags: nginx
  when: not ansible_check_mode

- name: Wait for Nginx to start
  wait_for:
    host: 0.0.0.0
    port: "{{ public_http_port }}"
    delay: 2
    timeout: 30
  tags: nginx
  when: not ansible_check_mode