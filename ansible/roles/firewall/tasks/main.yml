---
- name: Install UFW
  apt:
    name: ufw
    state: present
  tags: firewall

- name: Reset UFW to default
  ufw:
    state: reset
  tags: firewall

- name: Configure UFW defaults
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
  tags: firewall

- name: Allow SSH
  ufw:
    rule: allow
    port: '22'
    proto: tcp
  tags: firewall

- name: Allow privileged Burp TCP ports (redirect sources)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 80    # HTTP
    - 443   # HTTPS
    - 25    # SMTP
    - 587   # SMTPs
  tags: firewall

- name: Allow privileged Burp DNS Over UDP
  ufw:
    rule: allow
    port: '53'
    proto: udp

- name: Allow unprivileged Burp ports (redirect destinations)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ burp_http_port }}"
    - "{{ burp_https_port }}"
    - "{{ burp_smtp_port }}"
    - "{{ burp_smtps_port }}"
    - "{{ burp_polling_http_port }}"
    - "{{ burp_polling_https_port }}"
  tags: firewall

- name: Allow unprivileged Burp DNS port (UDP)
  ufw:
    rule: allow
    port: "{{ burp_dns_port }}"
    proto: udp
  tags: firewall

- name: Enable IP forwarding in sysctl
  sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes
  when: enable_port_forwarding
  tags: firewall

- name: Configure UFW to allow forwarding
  lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  when: enable_port_forwarding
  notify: reload ufw
  tags: firewall

- name: Add NAT rules for port forwarding (before.rules)
  blockinfile:
    path: /etc/ufw/before.rules
    marker: "# {mark} ANSIBLE MANAGED BURP PORT FORWARDING"
    insertbefore: "BOF"
    block: |
      # NAT table rules for port forwarding
      *nat
      :PREROUTING ACCEPT [0:0]
      
      # Forward DNS port 53 to Burp's unprivileged port {{ burp_dns_port }}
      -A PREROUTING -p tcp --dport 53 -j REDIRECT --to-port {{ burp_dns_port }}
      -A PREROUTING -p udp --dport 53 -j REDIRECT --to-port {{ burp_dns_port }}
      
      # Forward SMTP port 25 to Burp's unprivileged port {{ burp_smtp_port }}
      -A PREROUTING -p tcp --dport 25 -j REDIRECT --to-port {{ burp_smtp_port }}
      
      # Forward SMTPS port 587 to Burp's unprivileged port {{ burp_smtps_port }}
      -A PREROUTING -p tcp --dport 587 -j REDIRECT --to-port {{ burp_smtps_port }}
      
      # Commit the NAT table
      COMMIT
  when: enable_port_forwarding
  notify: reload ufw
  tags: firewall

- name: Enable UFW
  ufw:
    state: enabled
  when: enable_firewall
  tags: firewall

- name: Display UFW status
  command: ufw status verbose
  register: ufw_status
  changed_when: false
  tags: firewall

- name: Show UFW status
  debug:
    var: ufw_status.stdout_lines
  tags: firewall