---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  tags: common

- name: Upgrade all packages
  apt:
    upgrade: dist
    autoremove: yes
    autoclean: yes
  tags: common

- name: Install useful/needed packages
  apt:
    name:
      - curl
      - wget
      - net-tools
      - dnsutils
      - python3
      - python3-pip
      - apt-transport-https
      - ca-certificates
      - software-properties-common
      - gnupg
      - lsb-release
      - fail2ban
      - certbot
    state: present
  tags: common

- name: Install Java
  apt:
    name: "{{ java_package }}"
    state: present
  tags:
    - common
    - java

- name: Verify Java installation
  command: java -version
  register: java_version
  changed_when: false
  tags:
    - common
    - java

- name: Display Java version
  debug:
    var: java_version.stderr_lines
  tags:
    - common
    - java

# Burp specific common tasks
- name: Create Burp user
  user:
    name: "{{ burp_user }}"
    system: yes
    shell: /bin/bash
    home: "{{ burp_install_dir }}"
    create_home: yes
  tags:
    - common
    - burp
  check_mode: no

- name: Create Burp directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ burp_user }}"
    group: "{{ burp_group }}"
    mode: '0755'
  loop:
    - "{{ burp_install_dir }}"
    - "{{ burp_log_dir }}"
  tags:
    - common
    - burp

- name: Configure system limits for Burp user
  pam_limits:
    domain: "{{ burp_user }}"
    limit_type: "{{ item.type }}"
    limit_item: "{{ item.item }}"
    value: "{{ item.value }}"
  loop:
    - { type: 'soft', item: 'nofile', value: '65536' }
    - { type: 'hard', item: 'nofile', value: '65536' }
    - { type: 'soft', item: 'nproc', value: '32768' }
    - { type: 'hard', item: 'nproc', value: '32768' }
  tags:
    - common
    - burp

- name: Set timezone to UTC
  timezone:
    name: UTC
  tags: common

- name: Configure sysctl for network performance
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { key: 'net.core.rmem_max', value: '134217728' }
    - { key: 'net.core.wmem_max', value: '134217728' }
    - { key: 'net.ipv4.tcp_rmem', value: '4096 87380 67108864' }
    - { key: 'net.ipv4.tcp_wmem', value: '4096 65536 67108864' }
    - { key: 'net.ipv4.ip_local_port_range', value: '1024 65535' }
    - { key: 'net.core.netdev_max_backlog', value: '5000' }
  tags: common

- name: Create fail2ban jail.local configuration
  template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: 0644
  notify: Restart fail2ban
  tags:
    - common
    - fail2ban

- name: Ensure fail2ban is enabled and started
  service:
    name: fail2ban
    state: started
    enabled: yes
  tags:
    - common
    - fail2ban