- name: Check certificate mode
  debug:
    msg: "Certificate mode '{{ cert_mode }}' is not actively supported. Use cert_mode: selfsigned"
  when: cert_mode != "selfsigned"
  tags: letsencrypt

- name: Fail if Let's Encrypt mode is selected
  fail:
    msg: |
      Let's Encrypt support is not currently implemented.
      Please use cert_mode: selfsigned in your group_vars/aws.yml
      
      For Let's Encrypt, manually obtain certificates and place them in:
        {{ ssl_cert_file }}
        {{ ssl_key_file }}
  when: cert_mode != "selfsigned"
  tags: letsencrypt