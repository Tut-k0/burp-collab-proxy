---
- name: Install certbot and dependencies
  apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present
  tags: letsencrypt

- name: Create Let's Encrypt challenge directory
  file:
    path: /var/www/letsencrypt
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    mode: '0755'
  tags: letsencrypt

- name: Check if certificates already exist
  stat:
    path: "/etc/letsencrypt/live/{{ collaborator_domain }}/fullchain.pem"
  register: cert_exists
  tags: letsencrypt

- name: Stop nginx temporarily for initial certificate
  systemd:
    name: nginx
    state: stopped
  when: not cert_exists.stat.exists
  tags: letsencrypt

- name: Obtain Let's Encrypt certificate (standalone mode)
  command: >
    certbot certonly
    --standalone
    --non-interactive
    --agree-tos
    --email {{ letsencrypt_email }}
    {% if letsencrypt_staging %}--staging{% endif %}
    -d {{ collaborator_domain }}
    -d *.{{ collaborator_domain }}
    --preferred-challenges http
  when: not cert_exists.stat.exists
  register: certbot_result
  failed_when: certbot_result.rc != 0
  tags: letsencrypt

- name: Start nginx after certificate obtained
  systemd:
    name: nginx
    state: started
  when: not cert_exists.stat.exists
  tags: letsencrypt

- name: Create symbolic link for certificate
  file:
    src: "/etc/letsencrypt/live/{{ collaborator_domain }}/fullchain.pem"
    dest: "{{ ssl_cert_file }}"
    state: link
    force: yes
  notify:
    - restart burp-collaborator
    - restart nginx
  tags: letsencrypt

- name: Create symbolic link for private key
  file:
    src: "/etc/letsencrypt/live/{{ collaborator_domain }}/privkey.pem"
    dest: "{{ ssl_key_file }}"
    state: link
    force: yes
  notify:
    - restart burp-collaborator
    - restart nginx
  tags: letsencrypt

- name: Set correct permissions on certificate directory
  file:
    path: "/etc/letsencrypt/live/{{ collaborator_domain }}"
    state: directory
    owner: root
    group: "{{ burp_group }}"
    mode: '0750'
    recurse: yes
  tags: letsencrypt

- name: Set correct permissions on archive directory
  file:
    path: "/etc/letsencrypt/archive/{{ collaborator_domain }}"
    state: directory
    owner: root
    group: "{{ burp_group }}"
    mode: '0750'
    recurse: yes
  tags: letsencrypt

- name: Create certbot renewal hook script
  template:
    src: renewal-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/burp-restart.sh
    owner: root
    group: root
    mode: '0755'
  tags: letsencrypt

- name: Setup certbot auto-renewal timer
  systemd:
    name: certbot.timer
    enabled: yes
    state: started
  tags: letsencrypt

- name: Test certificate renewal
  command: certbot renew --dry-run
  register: renewal_test
  changed_when: false
  failed_when: false
  tags: letsencrypt

- name: Display renewal test results
  debug:
    var: renewal_test.stdout_lines
  tags: letsencrypt

- name: Display certificate information
  command: certbot certificates
  register: cert_info
  changed_when: false
  tags: letsencrypt

- name: Show certificate details
  debug:
    var: cert_info.stdout_lines
  tags: letsencrypt