---
- name: Deploy Burp Collaborator Server (Local Development)
  hosts: local
  become: yes
  gather_facts: yes
  vars_files:
    - ../group_vars/local.yml

  pre_tasks:
    - name: Display deployment information
      debug:
        msg:
          - "Deploying Burp Collaborator to: {{ inventory_hostname }}"
          - "Domain: {{ collaborator_domain }}"
          - "Certificate Mode: {{ cert_mode }}"
          - "Burp HTTP Port: {{ burp_http_port }}"
          - "Burp HTTPS Port: {{ burp_https_port }}"
          - "Burp DNS Port: {{ burp_dns_port }} (forwarded from 53)"
      tags: always

  roles:
    - role: common
      tags: common

    - role: firewall
      tags: firewall
      when: enable_firewall

    - role: self-signed-certs
      tags: ssl
      when: cert_mode == "selfsigned"

    - role: burp-collaborator
      tags: burp

    - role: nginx-proxy
      tags: nginx

  post_tasks:
    - name: Display deployment summary
      debug:
        msg:
          - "============================================"
          - "Burp Collaborator Deployment Complete!"
          - "============================================"
          - ""
          - "Access Information:"
          - "  - Domain: {{ collaborator_domain }}"
          - "  - IP Address: {{ ansible_default_ipv4.address }}"
          - "  - HTTP: http://{{ ansible_default_ipv4.address }}"
          - "  - HTTPS: https://{{ ansible_default_ipv4.address }}"
          - ""
          - "DNS Configuration Required:"
          - "  Add these DNS records to your domain:"
          - "  - A record:  {{ collaborator_domain }} → {{ ansible_default_ipv4.address }}"
          - "  - A record:  *.{{ collaborator_domain }} → {{ ansible_default_ipv4.address }}"
          - "  - NS record: {{ collaborator_domain }} → ns1.{{ collaborator_domain }}"
          - "  - A record:  ns1.{{ collaborator_domain }} → {{ ansible_default_ipv4.address }}"
          - ""
          - "Burp Suite Configuration:"
          - "  1. Go to Project options > Misc > Burp Collaborator Server"
          - "  2. Select 'Use a private Collaborator server'"
          - "  3. Server location: {{ collaborator_domain }}"
          - "  4. Polling location: polling.{{ collaborator_domain }}"
          - ""
          - "Service Status:"
          - "  systemctl status burp-collaborator"
          - "  systemctl status nginx"
          - ""
          - "View Logs:"
          - "  - Burp: journalctl -u burp-collaborator -f"
          - "  - Nginx Access: tail -f /var/log/nginx/burp-access.log"
          - "  - Nginx Error: tail -f /var/log/nginx/burp-error.log"
          - ""
          - "Port Forwarding (UFW):"
          - "  - Port 53 → {{ burp_dns_port }} (DNS)"
          - "  - Port 25 → {{ burp_smtp_port }} (SMTP)"
          - "  - Port 587 → {{ burp_smtps_port }} (SMTPS)"
          - ""
          - "Internal Ports:"
          - "  - Event Capture HTTP: {{ burp_http_port }}"
          - "  - Event Capture HTTPS: {{ burp_https_port }}"
          - "  - Polling HTTP: {{ burp_polling_http_port }}"
          - "  - Polling HTTPS: {{ burp_polling_https_port }}"
          - "  - DNS: {{ burp_dns_port }}"
          - ""
          - "Certificate Location:"
          - "  - Cert: {{ ssl_cert_file }}"
          - "  - Key: {{ ssl_key_file }}"
          - ""
          - "Testing:"
          - "  1. Test DNS: dig @{{ ansible_default_ipv4.address }} test.{{ collaborator_domain }}"
          - "  2. Test HTTP: curl http://{{ ansible_default_ipv4.address }}"
          - "  3. Test HTTPS: curl -k https://{{ ansible_default_ipv4.address }}"
          - "  4. For self-signed certs, import {{ ssl_cert_file }} to your system trust store"
          - ""
      tags: always

    - name: Verify services are running
      systemd:
        name: "{{ item }}"
        state: started
      loop:
        - burp-collaborator
        - nginx
      tags: always
      when: not ansible_check_mode